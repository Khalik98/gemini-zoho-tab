<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 90vh; }
        #chat-box { flex: 1; border: 1px solid #ccc; padding: 10px; overflow-y: auto; margin-bottom: 10px; border-radius: 5px; }
        #input-container { display: flex; gap: 10px; }
        #user-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat-box"></div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Ask Gemini...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const API_KEY = "AQ.Ab8RN6IOg7J0uZ4gvEMrFNS66oQdGp6wpwpUK-_tNRNELjG4ng"; // Replace with your actual key

        async function sendMessage() {
            const inputEl = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const message = inputEl.value.trim();
            if (!message) return;

            chatBox.innerHTML += `<p><strong>You:</strong> ${message}</p>`;
            inputEl.value = '';

            // Replace your old 'try' block with this:
try {
    const response = await fetch(`https://googleapis.com{API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: message }] }] })
    });
    
    const data = await response.json();
    
    // Correctly drilling down into the Gemini API arrays
    if (data.candidates && data.candidates[0].content.parts[0].text) {
        const reply = data.candidates[0].content.parts[0].text;
        chatBox.innerHTML += `<p><strong>Gemini:</strong> ${reply}</p>`;
    } else {
        chatBox.innerHTML += `<p style="color:red;"><strong>Error:</strong> Unexpected API response structure.</p>`;
    }
} catch (error) {
    chatBox.innerHTML += `<p style="color:red;"><strong>Error:</strong> ${error.message}</p>`;
}

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
