    <script>
        // 1. Put your actual Gemini API key inside the quotes below
        const API_KEY = "AQ.Ab8RN6IOg7J0uZ4gvEMrFNS66oQdGp6wpwpUK-_tNRNELjG4ng"; 

        async function sendMessage() {
            const inputEl = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const message = inputEl.value.trim();
            if (!message) return;

            // Display user message
            chatBox.innerHTML += `<p><strong>You:</strong> ${message}</p>`;
            inputEl.value = '';

            try {
                // 2. This exact URL structure ensures the key is passed as a parameter, not a domain
                const url = "https://googleapis.com" + API_KEY;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: message }] }] })
                });
                
                const data = await response.json();
                
                // 3. Drill safely into the Gemini response payload structure
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    chatBox.innerHTML += `<p><strong>Gemini:</strong> ${reply}</p>`;
                } else if (data.error) {
                    chatBox.innerHTML += `<p style="color:red;"><strong>API Error:</strong> ${data.error.message}</p>`;
                } else {
                    chatBox.innerHTML += `<p style="color:red;"><strong>Error:</strong> Unexpected response structure.</p>`;
                }
            } catch (error) {
                chatBox.innerHTML += `<p style="color:red;"><strong>Network Error:</strong> ${error.message}</p>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
